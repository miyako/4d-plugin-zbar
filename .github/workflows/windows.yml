name: Windows scanner validation

on:
  pull_request:
  push:
    branches-ignore: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        configuration: [Release, Debug]
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build and test pinned scanner
        shell: pwsh
        run: ./windows/build-zbar.ps1 -Configuration ${{ matrix.configuration }} -Test
      - name: Build plugin with the same header and static libraries
        shell: pwsh
        run: |
          msbuild ZBAR.sln /p:Configuration=${{ matrix.configuration }} /p:Platform=x64 /p:WindowsTargetPlatformVersion=10.0 /m
          if ($LASTEXITCODE -ne 0) { throw "Plugin build failed" }
      - name: Compare former library defaults and fixtures (Release only)
        if: matrix.configuration == 'Release'
        shell: pwsh
        run: |
          $revision = "e3b59753123774b7c14ceb32de4f77b78e2bcc78"
          git fetch --depth=1 origin $revision
          if ($LASTEXITCODE -ne 0) { throw "Baseline fetch failed" }
          New-Item -ItemType Directory -Force build/legacy | Out-Null
          git archive -o build/legacy.tar $revision include/0.11 lib/Windows64/libzbar.0.11.lib
          if ($LASTEXITCODE -ne 0) { throw "Baseline archive failed" }
          tar -xf build/legacy.tar -C build/legacy
          if ($LASTEXITCODE -ne 0) { throw "Baseline extraction failed" }
          $hash = (Get-FileHash build/legacy/lib/Windows64/libzbar.0.11.lib).Hash
          if ($hash -ne "16d0583cf89c645b7c584b4700374f7a864ecc9c2d6a42f334dde674ff57deb2") {
            throw "Legacy library checksum mismatch"
          }
          cmake -S tests/windows/legacy -B build/legacy-test -A x64 "-DLEGACY_ROOT=$pwd/build/legacy"
          if ($LASTEXITCODE -ne 0) { throw "Baseline configure failed" }
          cmake --build build/legacy-test --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw "Baseline build failed" }
          & build/legacy-test/Release/legacy-scanner.exe test/Resources tests/windows/resources | Tee-Object build/legacy-results.txt
          if ($LASTEXITCODE -ne 0) { throw "Baseline decode failed" }
          & build/windows-zbar/x64/Release/scanner-test.exe test/Resources tests/windows/resources | Tee-Object build/modern-results.txt
          if ($LASTEXITCODE -ne 0) { throw "Modern comparison decode failed" }
          $old = @(Get-Content build/legacy-results.txt | Where-Object { $_ -match '^default ' -and $_ -notmatch '^default 57:' })
          $new = @(Get-Content build/modern-results.txt | Where-Object { $_ -match '^default ' -and $_ -notmatch '^default 57:' })
          if (Compare-Object $old $new) { throw "Supported decoder defaults changed" }
      - name: Verify release relink archive (no release publication)
        if: matrix.configuration == 'Release'
        shell: pwsh
        run: ./windows/package-relink.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.configuration }}
          path: |
            test/Plugins/ZBAR.bundle/Contents/Windows64/ZBAR.4DX
            build/windows-zbar/x64/install/${{ matrix.configuration }}/licenses
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: matrix.configuration == 'Release'
        with:
          name: windows-relink
          path: build/windows-relink.zip
          if-no-files-found: error
